<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #08090d; --ink: #f4f2ee; --red: #e31937; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--ground); }
      .shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #dip { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 20; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <video id="s1" class="clip shot" src="assets/clips/lineup.mp4" data-start="0.0" data-duration="3.3" data-media-start="3.4" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:1"></video>
      <video id="s2" class="clip shot" src="assets/clips/gp.mp4" data-start="3.3" data-duration="2.4" data-media-start="0.0" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:2"></video>
      <video id="s3" class="clip shot" src="assets/clips/ramp.mp4" data-start="5.7" data-duration="4.2" data-media-start="3.6" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:3"></video>
      <video id="s4" class="clip shot" src="assets/clips/trench.mp4" data-start="9.9" data-duration="4.4" data-media-start="2.4" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:4"></video>
      <video id="s5" class="clip shot" src="assets/clips/loop.mp4" data-start="14.3" data-duration="1.8" data-media-start="3.8" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:5"></video>
      <video id="s6" class="clip shot" src="assets/clips/gp.mp4" data-start="16.1" data-duration="2.9" data-media-start="5.8" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:6"></video>
      <video id="s7" class="clip shot" src="assets/clips/trench.mp4" data-start="19.0" data-duration="2.0" data-media-start="7.0" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:7"></video>
      <video id="s8" class="clip shot" src="assets/clips/ramp.mp4" data-start="21.0" data-duration="2.8" data-media-start="6.0" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:8"></video>
      <video id="s9" class="clip shot" src="assets/clips/gp.mp4" data-start="23.8" data-duration="2.5" data-media-start="2.4" data-track-index="1" data-has-audio="true" data-volume="1" data-fade-in="0.05" data-fade-out="0.08" playsinline style="z-index:9"></video>
      <div id="dip" class="clip" data-start="0" data-duration="26.3" data-track-index="2"></div>
      <div id="lines" data-composition-id="lines" data-composition-src="compositions/lines.html" data-start="0" data-duration="26.3" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:30"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="26.3" data-duration="3.7" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:30"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#dip", { opacity: 0 }, 0);
      for (const t of [5.7, 9.9, 19.0, 23.8]) {
        tl.to("#dip", { opacity: 0.45, duration: 0.1, ease: "power2.in" }, t - 0.1);
        tl.set("#dip", { opacity: 0 }, t);
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
