<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voltitude</title>
<meta name="description" content="A time-trial stunt racer for the car that sticks to anything and jumps over everything.">
<meta name="theme-color" content="#08090d">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wdth,wght@87.5,500&display=swap">
<link rel="stylesheet" href="src/style.css">
<link rel="modulepreload" href="rl/vendor/three-r169/build/three.module.js">
<script type="importmap">{"imports":{"three":"./rl/vendor/three-r169/build/three.module.js","@rl/":"./rl/"}}</script>
</head>
<body>
<canvas id="view" aria-label="Race view"></canvas>

<div id="touch" class="touch" hidden>
  <div class="t-pad"><span class="t-stick" aria-hidden="true"></span></div>
  <button type="button" data-t="pause" class="t-pause" aria-label="Pause">II</button>
  <div class="t-btns">
    <button type="button" data-t="lift">LIFT</button>
    <button type="button" data-t="boost">BOOST</button>
    <button type="button" data-t="brake">BRAKE</button>
    <button type="button" data-t="gas" class="t-gas">GAS</button>
  </div>
  <p class="t-help">Drag to steer · tap to hop · hold to hover · second finger boosts</p>
</div>
<div id="hud" class="hud" hidden>
  <div class="hud-tl">
    <div class="card-label" id="card"></div>
    <div class="cp-label" id="cpLabel">CHECKPOINT <span id="cps">0/0</span></div>
    <ol class="tower" id="tower" aria-label="Timing tower"></ol>
  </div>
  <div class="hud-clock">
    <div class="clock" id="clock">0:00.000</div>
    <div class="sectors" id="sectors" aria-hidden="true"></div>
    <div class="delta" id="delta"></div>
    <div class="target" id="target"></div>
  </div>
  <svg class="map" id="map" viewBox="0 0 100 100" aria-hidden="true"></svg>

  <div class="hud-center">
    <div class="lights" id="lights" aria-hidden="true"><i><b></b><b></b></i><i><b></b><b></b></i><i><b></b><b></b></i><i><b></b><b></b></i><i><b></b><b></b></i></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="marker" id="marker"><span class="marker-dist" id="markerDist"></span></div>

  <div class="dash">
    <div class="hint" id="hint" aria-live="polite"></div>
    <div class="readout">
      <div class="state" id="state"></div>
      <div class="speed"><span id="speed">0</span><small id="unit">MPH</small></div>
      <div class="gas" id="gas" aria-label="Gas tank">
        <span class="gas-label">GAS</span>
        <div class="gas-bar"><i id="gasFill"></i><b class="gas-res"></b><s id="gasEdge"></s><u id="gasLift"></u></div>
        <span class="gas-pct" id="gasPct">50</span>
        <div class="gas-gains" id="gasGains"></div>
      </div>
    </div>
  </div>
</div>

 <section id="share" class="share" hidden role="dialog" aria-modal="true" aria-labelledby="shareTitle">
  <h2 id="shareTitle">Share clip</h2>
  <p class="share-lede">The last ten seconds, with the score burned in.</p>
  <div class="share-row" id="sharePick"><button data-fmt="portrait">Portrait 9:16</button><button data-fmt="landscape">Landscape 16:9</button></div>
  <div class="share-bar" aria-hidden="true"><i id="shareFill"></i></div>
  <p class="share-note" id="shareNote" role="status" aria-live="polite"></p>
  <div class="share-row" id="shareDone" hidden><button id="shareSend">Share</button><button id="shareSave">Save video</button><button id="shareLink">Copy ghost link</button></div>
  <button class="share-close" id="shareClose">Close</button>
</section>

<div id="replayBug" class="replay-bug" aria-hidden="true" hidden><i></i>REPLAY</div>
<div id="menuLive" class="sr" role="status" aria-live="polite"></div>
<section id="fallback" class="fallback" hidden aria-label="Menu"></section>

<div id="loading" class="loading" role="status"><div class="loading-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 10h15l11 26 11-26h15L39 50H25z" fill="currentColor"/><rect x="22" y="55" width="20" height="5" fill="var(--red)"/></svg>VOLTITUDE</div><div class="loading-bar"><i id="loadFill"></i></div><span id="loadText">Building the course…</span></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
